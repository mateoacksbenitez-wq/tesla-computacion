<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="intelBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066da"/>
      <stop offset="50%" stop-color="#0048b3"/>
      <stop offset="100%" stop-color="#002b80"/>
    </linearGradient>
    <linearGradient id="chipGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259"/>
      <stop offset="100%" stop-color="#ffa751"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#001848" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Box 3D -->
  <rect x="50" y="50" width="300" height="300" rx="24" fill="url(#intelBlue)" filter="url(#shadow)"/>
  
  <!-- Cyber Circuit Lines -->
  <path d="M 60 120 L 140 120 L 170 150 L 280 150" stroke="rgba(255,255,255,0.15)" stroke-width="3" fill="none"/>
  <path d="M 120 320 L 200 320 L 230 290 L 330 290" stroke="rgba(255,255,255,0.15)" stroke-width="3" fill="none"/>
  <circle cx="280" cy="150" r="5" fill="#00d2ff"/>
  <circle cx="120" cy="320" r="5" fill="#00d2ff"/>

  <!-- Intel Logo Text -->
  <text x="200" y="115" font-family="'Montserrat', 'Segoe UI', sans-serif" font-weight="700" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="4">intel</text>
  
  <!-- Core Box -->
  <rect x="90" y="145" width="220" height="110" rx="14" fill="rgba(0, 18, 60, 0.4)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <text x="200" y="195" font-family="'Montserrat', 'Segoe UI', sans-serif" font-weight="800" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="1">CORE</text>
  <text x="200" y="240" font-family="'Montserrat', 'Segoe UI', sans-serif" font-weight="800" font-size="38" fill="#00d2ff" text-anchor="middle">i5</text>

  <!-- Model Badge -->
  <rect x="110" y="280" width="180" height="36" rx="18" fill="url(#chipGold)"/>
  <text x="200" y="304" font-family="'Montserrat', 'Segoe UI', sans-serif" font-weight="800" font-size="16" fill="#002b80" text-anchor="middle" letter-spacing="1">i5-12400F</text>
</svg>
