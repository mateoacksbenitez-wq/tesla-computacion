<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="intelDarkBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004aad"/>
      <stop offset="60%" stop-color="#001f5c"/>
      <stop offset="100%" stop-color="#050a1a"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="50%" stop-color="#f59f00"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow7" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000e2e" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Box 3D -->
  <rect x="50" y="50" width="300" height="300" rx="24" fill="url(#intelDarkBlue)" filter="url(#shadow7)" stroke="rgba(255,215,0,0.3)" stroke-width="2"/>
  
  <!-- Cyber Circuit Lines -->
  <path d="M 60 110 L 160 110 L 190 140 L 320 140" stroke="rgba(255,220,100,0.3)" stroke-width="2.5" fill="none"/>
  <path d="M 90 330 L 180 330 L 210 300 L 340 300" stroke="rgba(0,210,255,0.3)" stroke-width="2.5" fill="none"/>
  <circle cx="320" cy="140" r="5" fill="#f59f00"/>
  <circle cx="90" cy="330" r="5" fill="#00d2ff"/>

  <!-- Intel Logo Text -->
  <text x="200" y="115" font-family="'Montserrat', 'Segoe UI', sans-serif" font-weight="700" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="4">intel</text>
  
  <!-- Core Box -->
  <rect x="85" y="145" width="230" height="110" rx="14" fill="rgba(0, 10, 35, 0.6)" stroke="url(#goldGradient)" stroke-width="2"/>
  <text x="200" y="195" font-family="'Montserrat', 'Segoe UI', sans-serif" font-weight="800" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="2">CORE</text>
  <text x="200" y="242" font-family="'Montserrat', 'Segoe UI', sans-serif" font-weight="900" font-size="42" fill="url(#goldGradient)" text-anchor="middle">i7</text>

  <!-- Model Badge -->
  <rect x="100" y="280" width="200" height="38" rx="19" fill="url(#goldGradient)"/>
  <text x="200" y="305" font-family="'Montserrat', 'Segoe UI', sans-serif" font-weight="900" font-size="16" fill="#0a1128" text-anchor="middle" letter-spacing="1">i7-14700KF</text>
</svg>
