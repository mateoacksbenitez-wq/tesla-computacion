<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="apuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="radeonRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="shadowApu" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect x="50" y="50" width="300" height="300" rx="24" fill="url(#apuGrad)" filter="url(#shadowApu)" stroke="#334155" stroke-width="2"/>
  
  <!-- Silicon Chip Graphic -->
  <rect x="120" y="110" width="160" height="130" rx="12" fill="#1e293b" stroke="url(#radeonRed)" stroke-width="2.5"/>
  <rect x="140" y="130" width="120" height="90" rx="8" fill="#0f172a"/>
  
  <!-- Circuit pins -->
  <circle cx="155" cy="155" r="6" fill="#ef4444"/>
  <circle cx="180" cy="155" r="6" fill="#00d2ff"/>
  <circle cx="205" cy="155" r="6" fill="#10b981"/>
  <circle cx="230" cy="155" r="6" fill="#f59e0b"/>

  <text x="200" y="195" font-family="'Montserrat', sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle" letter-spacing="1">iGPU / APU</text>

  <!-- Title & Badge -->
  <rect x="90" y="275" width="220" height="38" rx="19" fill="url(#radeonRed)"/>
  <text x="200" y="300" font-family="'Montserrat', sans-serif" font-weight="800" font-size="13.5" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">GRÁFICOS INTEGRADOS</text>
</svg>
